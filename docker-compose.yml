services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "db.adminCommand('ping').ok" || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongodb-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh --quiet --host mongodb:27017 --eval "
        try {
          rs.status();
        } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] });
        }
      "

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ requires keys never to be evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # S3-compatible object storage for local development. In production, point
  # the S3_* variables at Cloudflare R2 or AWS S3 instead.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-devaccesskey}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devsecretkey}
    ports:
      - "8333:8333"
    volumes:
      - storage_data:/data

  # Creates the bucket and the CORS rule browsers need for direct uploads
  # (ExposeHeaders ETag lets the client read each part's ETag).
  storage-init:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      - storage
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-devaccesskey}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devsecretkey}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      BUCKET: ${S3_BUCKET:-vods}
      APP_ORIGIN: ${BETTER_AUTH_URL:-http://localhost:3000}
    command:
      - |
        S3="aws --endpoint-url http://storage:8333 s3api"
        until $$S3 list-buckets >/dev/null 2>&1; do sleep 1; done
        $$S3 head-bucket --bucket "$$BUCKET" 2>/dev/null || $$S3 create-bucket --bucket "$$BUCKET"
        $$S3 put-bucket-cors --bucket "$$BUCKET" --cors-configuration "{
          \"CORSRules\": [{
            \"AllowedOrigins\": [\"$$APP_ORIGIN\"],
            \"AllowedMethods\": [\"PUT\", \"GET\", \"HEAD\"],
            \"AllowedHeaders\": [\"*\"],
            \"ExposeHeaders\": [\"ETag\"],
            \"MaxAgeSeconds\": 3600
          }]
        }"
        echo "Bucket $$BUCKET ready"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "mongodb://mongodb:27017/app?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379"
      S3_ENDPOINT: "http://storage:8333"
      S3_PUBLIC_ENDPOINT: "http://localhost:8333"
      S3_FORCE_PATH_STYLE: "true"

  # Video pipeline (Python + ffmpeg), consumes the "pipeline" BullMQ queue.
  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: "mongodb://mongodb:27017/app?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379"
      S3_ENDPOINT: "http://storage:8333"
      S3_FORCE_PATH_STYLE: "true"
    # Lets the worker reach an Ollama server running on the host (optional).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - worker_tmp:/work
      # Whisper models are downloaded on first use and kept here.
      - whisper_models:/models

volumes:
  mongodb_data:
  redis_data:
  storage_data:
  worker_tmp:
  whisper_models:
